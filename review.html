<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordplay — image review</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { --bg:#faf6ef; --ink:#2c2a26; --dim:#6b665c; --line:#e0d9cc; --bad:#c0503f; }
  * { box-sizing: border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:19px; margin:0 0 4px; }
  p { margin:0; color:var(--dim); font-size:14px; }
  .bar { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { font:600 15px/1 inherit; border:0; border-radius:12px; padding:12px 15px;
    background:var(--ink); color:var(--bg); -webkit-appearance:none; }
  button.light { background:#fff; color:var(--ink); border:1px solid var(--line); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:12px; padding:16px; }
  figure { margin:0; position:relative; }
  figure img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;
    display:block; background:#fff; border:1px solid var(--line); }
  figure figcaption { font-size:13px; text-align:center; padding:5px 2px 0; }
  figure .t { font-size:11px; color:var(--dim); text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .x { position:absolute; top:6px; right:6px; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.94); color:var(--bad); border:1px solid var(--line);
    font:700 17px/1 inherit; padding:0; }
  figure.out img { opacity:.22; }
  figure.out .x { background:var(--bad); color:#fff; }
  figure.out figcaption { text-decoration:line-through; color:var(--dim); }
  .missing { display:flex; align-items:center; justify-content:center;
    aspect-ratio:1/1; border:1px dashed var(--line); border-radius:12px;
    font-size:44px; background:#fff; }
  #out { margin:0 16px 30px; padding:12px; border:1px solid var(--line);
    border-radius:12px; background:#fff; font:13px/1.5 ui-monospace,Menlo,monospace;
    white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>

<header>
  <h1>Image review</h1>
  <p>Tap the <b>&times;</b> on anything that isn't clearly the thing. Words with no
     photo show their emoji &mdash; that's fine, not a fault.</p>
  <div class="bar">
    <button id="copy">Copy reject list</button>
    <button class="light" id="share">Share</button>
    <button class="light" id="clear">Clear marks</button>
    <span id="count" style="align-self:center;color:var(--dim);font-size:14px"></span>
  </div>
</header>

<div id="grid"></div>
<div id="out">Nothing marked yet.</div>

<script src="js/words.js"></script>
<script>
(function () {
  "use strict";

  var KEY = "wordplay-rejects";
  var rejects = {};
  try { rejects = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { rejects = {}; }

  var grid = document.getElementById("grid");
  var out = document.getElementById("out");

  fetch("images/manifest.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .catch(function () { return {}; })
    .then(render);

  function render(manifest) {
    manifest = manifest || {};
    WORDS.forEach(function (w) {
      var entry = manifest[w.id];
      var fig = document.createElement("figure");
      fig.dataset.id = w.id;
      if (rejects[w.id]) fig.className = "out";

      if (entry && entry.file) {
        var img = document.createElement("img");
        img.src = "images/" + entry.file + "?v=" + Date.now();
        img.loading = "lazy";
        img.alt = "";
        fig.appendChild(img);

        var b = document.createElement("button");
        b.className = "x";
        b.type = "button";
        b.textContent = "×";
        b.addEventListener("click", function () { toggle(w.id, fig); });
        fig.appendChild(b);
      } else {
        var d = document.createElement("div");
        d.className = "missing";
        d.textContent = w.emoji;
        fig.appendChild(d);
      }

      var cap = document.createElement("figcaption");
      cap.textContent = w.labels.en.roman;
      fig.appendChild(cap);

      var t = document.createElement("div");
      t.className = "t";
      t.textContent = entry ? (entry.title || "") : "emoji only";
      t.title = entry ? (entry.title || "") : "";
      fig.appendChild(t);

      grid.appendChild(fig);
    });
    update();
  }

  function toggle(id, fig) {
    if (rejects[id]) delete rejects[id]; else rejects[id] = 1;
    fig.classList.toggle("out", !!rejects[id]);
    localStorage.setItem(KEY, JSON.stringify(rejects));
    update();
  }

  function list() { return Object.keys(rejects); }

  function update() {
    var l = list();
    document.getElementById("count").textContent =
      l.length ? l.length + " marked" : "";
    out.textContent = l.length
      ? l.join(",")
      : "Nothing marked yet.";
  }

  document.getElementById("copy").addEventListener("click", function () {
    var t = list().join(",");
    if (!t) return;
    var btn = this;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(t).then(function () {
        btn.textContent = "Copied — send it to Claude";
        setTimeout(function () { btn.textContent = "Copy reject list"; }, 2600);
      });
    }
  });

  document.getElementById("share").addEventListener("click", function () {
    var t = list().join(",");
    if (!t || !navigator.share) return;
    navigator.share({ title: "Wordplay image rejects", text: t }).catch(function () {});
  });

  document.getElementById("clear").addEventListener("click", function () {
    rejects = {};
    localStorage.removeItem(KEY);
    [].forEach.call(grid.querySelectorAll("figure"), function (f) {
      f.classList.remove("out");
    });
    update();
  });
}());
</script>
</body>
</html>

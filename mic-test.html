<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordplay — Mic Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="mic-test.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wordplay Test">
<meta name="theme-color" content="#1b1b1f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
  :root {
    --bg:#15151a; --card:#1f1f27; --line:#33333f; --fg:#f2f2f5; --dim:#9a9aa8;
    --ok:#38b46a; --bad:#e2564d; --warn:#e0a63a; --accent:#6c8cff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom)); }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:14px; margin:0 0 20px; }
  button { font:600 17px/1 inherit; color:#fff; background:var(--accent); border:0;
    border-radius:14px; padding:18px 20px; width:100%; margin:0 0 10px; -webkit-appearance:none; }
  button.secondary { background:var(--card); border:1px solid var(--line); color:var(--fg); }
  button:disabled { opacity:.4; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin:0 0 8px; display:flex; gap:12px; align-items:flex-start; }
  .mark { font-size:18px; line-height:1.3; width:22px; flex:none; text-align:center; }
  .row h3 { margin:0 0 2px; font-size:15px; font-weight:600; }
  .row p { margin:0; font-size:13.5px; color:var(--dim); }
  .row p b { color:var(--fg); font-weight:600; }
  .ok .mark{color:var(--ok)} .bad .mark{color:var(--bad)} .warn .mark{color:var(--warn)}
  .pending { opacity:.45; }
  #countdown { text-align:center; font-size:60px; font-weight:700; margin:10px 0;
    font-variant-numeric:tabular-nums; min-height:72px; }
  #countdown small { display:block; font-size:15px; font-weight:400; color:var(--dim); }
  pre { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px;
    font-size:11.5px; white-space:pre-wrap; word-break:break-word; color:var(--dim);
    -webkit-user-select:text; user-select:text; margin:8px 0 0; }
  .sep { height:1px; background:var(--line); margin:22px 0 18px; border:0; }
  .hide { display:none !important; }
</style>
</head>
<body>

<h1>Wordplay — microphone test</h1>
<p class="sub">Six checks. About two minutes. Nothing here is sent anywhere.</p>

<div id="results"></div>

<hr class="sep">

<div id="countdown"></div>

<button id="start">Start test</button>
<button id="playFresh" class="secondary hide">▶︎ Play what I just recorded</button>
<button id="playSaved" class="secondary hide">▶︎ Play the saved clip</button>
<button id="reload" class="secondary hide">↻ Reload and re-check storage</button>

<hr class="sep">
<button id="copy" class="secondary">Copy results as text</button>
<pre id="report">Run the test to fill this in.</pre>

<script>
(function () {
  "use strict";

  var CHECKS = [
    ["standalone", "Opened from the home screen"],
    ["secure",     "Secure connection (HTTPS)"],
    ["permission", "Microphone permission"],
    ["format",     "Audio format your iPhone records"],
    ["roundtrip",  "Recorded and played back"],
    ["storage",    "Survived a reload"],
    ["persist",    "Storage marked permanent"]
  ];

  var state = {};
  var resultsEl = document.getElementById("results");
  var reportEl  = document.getElementById("report");
  var cdEl      = document.getElementById("countdown");
  var freshBlob = null, freshUrl = null;

  CHECKS.forEach(function (c) {
    var d = document.createElement("div");
    d.className = "row pending";
    d.id = "row-" + c[0];
    d.innerHTML = '<div class="mark">•</div><div><h3></h3><p></p></div>';
    d.querySelector("h3").textContent = c[1];
    d.querySelector("p").textContent = "not checked yet";
    resultsEl.appendChild(d);
  });

  function set(key, status, msg) {
    state[key] = { status: status, msg: msg };
    var d = document.getElementById("row-" + key);
    d.className = "row " + status;
    d.querySelector(".mark").textContent =
      status === "ok" ? "✓" : status === "bad" ? "✕" : "!";
    d.querySelector("p").innerHTML = msg;
    writeReport();
  }

  function writeReport() {
    var ua = navigator.userAgent;
    var lines = ["WORDPLAY MIC TEST", new Date().toString(), "", "UA: " + ua, ""];
    CHECKS.forEach(function (c) {
      var s = state[c[0]];
      var mark = !s ? "[ ]" : s.status === "ok" ? "[PASS]" : s.status === "bad" ? "[FAIL]" : "[WARN]";
      lines.push(mark + " " + c[1] + " — " + (s ? s.msg.replace(/<[^>]+>/g, "") : "not checked"));
    });
    if (state._formats) lines.push("", "Formats supported: " + state._formats);
    reportEl.textContent = lines.join("\n");
  }

  /* ---------- passive checks, run immediately ---------- */

  var standalone = (window.navigator.standalone === true) ||
                   (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (standalone) {
    set("standalone", "ok", "Yes — running as a home-screen app. This is what we need.");
  } else {
    set("standalone", "warn",
      "<b>No — this is a browser tab.</b> Tap Share → Add to Home Screen, close Safari, " +
      "then open it from the new icon and run the test again. Results from a tab don't count.");
  }

  if (window.isSecureContext) {
    set("secure", "ok", "Yes — HTTPS. The microphone is allowed to work here.");
  } else {
    set("secure", "bad", "No. iOS blocks the microphone on non-HTTPS pages. Open the Netlify " +
                         "address, not a file or a local network address.");
  }

  /* format probe needs no permission */
  (function () {
    if (typeof MediaRecorder === "undefined") {
      set("format", "bad", "This iPhone has no MediaRecorder at all. Recording is impossible here — " +
                           "it needs iOS 14.3 or newer.");
      return;
    }
    var candidates = ["audio/mp4", "audio/mp4;codecs=mp4a.40.2", "audio/aac",
                      "audio/webm", "audio/webm;codecs=opus", "audio/ogg;codecs=opus",
                      "audio/mpeg", "audio/wav"];
    var supported = candidates.filter(function (t) {
      try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; }
    });
    state._formats = supported.length ? supported.join(", ") : "(none reported)";
    if (supported.length) {
      set("format", "ok", "Supported: <b>" + supported.join("</b>, <b>") + "</b>. " +
                          "I'll build the recorder around the first one.");
    } else {
      set("format", "warn", "Reported none — but Safari sometimes lies here and still records fine. " +
                            "The playback check below is the real answer.");
    }
  }());

  /* ---------- storage checks ---------- */

  var DB = "wordplay-mictest";
  function idb(fn) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("clips"); };
      r.onerror = function () { rej(r.error); };
      r.onsuccess = function () {
        var db = r.result;
        var tx = db.transaction("clips", "readwrite");
        var out = fn(tx.objectStore("clips"));
        tx.oncomplete = function () { db.close(); res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { rej(tx.error); };
      };
    });
  }

  function checkSaved() {
    idb(function (s) { return s.get("clip"); }).then(function (rec) {
      if (!rec || !rec.blob) {
        var row = document.getElementById("row-storage");
        row.querySelector("p").textContent = "Nothing saved yet — record a clip first, then reload.";
        row.className = "row pending";
        return;
      }
      var age = Math.round((Date.now() - rec.ts) / 1000);
      set("storage", "ok",
        "Found a <b>" + rec.bytes + " byte</b> clip saved " + age + "s ago as <b>" + rec.mime +
        "</b>. It survived. Tap <b>Play the saved clip</b> to hear it.");
      document.getElementById("playSaved").classList.remove("hide");
      document.getElementById("playSaved").onclick = function () { play(rec.blob, this); };
    }).catch(function (e) {
      set("storage", "bad", "Storage failed: " + e.message +
          ". Recordings would not survive closing the app.");
    });
  }
  checkSaved();

  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(function (est) {
      var mb = est.quota ? Math.round(est.quota / 1048576) : "?";
      navigator.storage.persisted().then(function (p) {
        set("persist", p ? "ok" : "warn",
          (p ? "Yes — marked permanent. " : "Not marked permanent yet (tap Start test to ask). ") +
          "About <b>" + mb + " MB</b> available, which is far more than 240 short clips need.");
      });
    });
  } else {
    set("persist", "warn", "This browser won't say. Not fatal — home-screen apps are exempt from " +
                           "Safari's 7-day cleanup anyway.");
  }

  /* ---------- playback helper ---------- */

  function play(blob, btn) {
    var url = URL.createObjectURL(blob);
    var a = new Audio();
    a.src = url;
    a.onended = function () { URL.revokeObjectURL(url); if (btn) btn.textContent = btn.dataset.t; };
    a.onerror = function () {
      set("roundtrip", "bad", "The clip recorded but would not play back. Format problem — " +
          "send me this screen and I'll change the recorder.");
    };
    if (btn) { btn.dataset.t = btn.dataset.t || btn.textContent; btn.textContent = "♪ playing…"; }
    a.play().catch(function (e) {
      if (btn) btn.textContent = btn.dataset.t;
      alert("Playback was blocked: " + e.message + "\nTap the button again.");
    });
  }

  /* ---------- the active test ---------- */

  document.getElementById("start").onclick = function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = "Asking for the microphone…";

    if (navigator.storage && navigator.storage.persist) { navigator.storage.persist(); }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      set("permission", "bad", "This iPhone doesn't offer microphone access to web apps at all.");
      btn.textContent = "Start test"; btn.disabled = false; return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      set("permission", "ok", "Granted. iOS allowed the microphone inside the home-screen app.");
      btn.textContent = "Recording…";

      var mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].filter(function (t) {
        try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; }
      })[0];

      var rec;
      try {
        rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      } catch (e) {
        set("roundtrip", "bad", "Could not start a recorder: " + e.message);
        stream.getTracks().forEach(function (t) { t.stop(); });
        btn.textContent = "Start test"; btn.disabled = false; return;
      }

      var chunks = [];
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };

      rec.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        cdEl.innerHTML = "";
        var actual = rec.mimeType || mime || "unknown";
        freshBlob = new Blob(chunks, { type: actual });

        if (!freshBlob.size) {
          set("roundtrip", "bad", "Recording produced 0 bytes. The microphone was granted but " +
              "captured nothing. Check the phone isn't muted or in a call.");
          btn.textContent = "Try again"; btn.disabled = false; return;
        }

        set("format", "ok", "Actually recorded as <b>" + actual + "</b>, " +
            freshBlob.size + " bytes for 3 seconds. This is the format I'll build around.");
        set("roundtrip", "ok",
            "Recorded <b>" + freshBlob.size + " bytes</b>. Tap <b>Play what I just recorded</b> — " +
            "if you hear your own voice, this check truly passed.");

        var p = document.getElementById("playFresh");
        p.classList.remove("hide");
        p.onclick = function () { play(freshBlob, this); };

        idb(function (s) {
          s.put({ blob: freshBlob, mime: actual, bytes: freshBlob.size, ts: Date.now() }, "clip");
        }).then(function () {
          document.getElementById("reload").classList.remove("hide");
          set("storage", "warn", "Saved. Now tap <b>Reload and re-check storage</b> to prove it " +
                                 "survives the app closing.");
        }).catch(function (e) {
          set("storage", "bad", "Could not save to storage: " + e.message);
        });

        btn.textContent = "Record again";
        btn.disabled = false;
      };

      try {
        rec.start();
      } catch (e) {
        // Permission was fine — the recorder is what failed. Say so precisely,
        // rather than sending you off to re-add the home-screen icon for nothing.
        set("roundtrip", "bad", "The microphone was granted, but the recorder refused to start: <b>" +
            e.name + "</b> — " + e.message + ". Send me this screen; it's a format problem, not a " +
            "permission problem.");
        stream.getTracks().forEach(function (t) { t.stop(); });
        cdEl.innerHTML = "";
        btn.textContent = "Try again"; btn.disabled = false;
        return;
      }

      var left = 3;
      cdEl.innerHTML = left + "<small>say her name out loud</small>";
      var iv = setInterval(function () {
        left--;
        if (left > 0) { cdEl.innerHTML = left + "<small>say her name out loud</small>"; }
        else { clearInterval(iv); cdEl.innerHTML = "<small>done</small>"; try { rec.stop(); } catch (e) {} }
      }, 1000);

    }).catch(function (err) {
      // Anything that blows up AFTER permission was granted is not a permission
      // problem. Never relabel a granted mic as a denied one.
      if (state.permission && state.permission.status === "ok") {
        set("roundtrip", "bad", "Permission was granted, but recording failed afterwards: <b>" +
            (err && err.name) + "</b> — " + (err && err.message) + ".");
        btn.textContent = "Try again"; btn.disabled = false;
        return;
      }
      var m = err && err.name === "NotAllowedError"
        ? "<b>Denied.</b> Either you tapped Don't Allow, or iOS is remembering an earlier no. " +
          "Fix: delete the home-screen icon, re-add it from Safari, and try again."
        : "Failed: " + (err && (err.name + " — " + err.message));
      set("permission", "bad", m);
      btn.textContent = "Try again";
      btn.disabled = false;
    });
  };

  document.getElementById("reload").onclick = function () { location.reload(); };

  document.getElementById("copy").onclick = function () {
    var btn = this, txt = reportEl.textContent;
    var done = function () { btn.textContent = "Copied — paste it to me"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () {
        btn.textContent = "Couldn't copy — screenshot instead";
      });
    } else { btn.textContent = "Couldn't copy — screenshot instead"; }
  };

  writeReport();
}());
</script>
</body>
</html>

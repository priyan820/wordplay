# Netlify reads this automatically on every deploy. Nothing to run.
# There is no build step: the folder is published exactly as it sits in git.

[build]
  publish = "."
  command = ""

# HTML and the service worker must never be cached by the CDN, or a push would
# not reach the phones. Everything else is content-addressed by the service
# worker's own cache, so it can be cached hard.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Nothing in this app talks to a network at runtime. This header enforces that:
# if any code ever tried to phone home, the browser would block it outright.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), interest-cohort=()"
